<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Monopoly</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10131a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hidden {
            display: none !important;
        }

        header {
            height: 65px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #171b24;
            border-bottom: 1px solid #303746;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        #status {
            color: #67ff8b;
            font-size: 13px;
        }

        #room-badge {
            margin-left: auto;
            background: #252b38;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        input,
        button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        input {
            background: #252b38;
            color: white;
        }

        button {
            background: #3978ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.secondary {
            background: #303746;
        }

        /* Home view */

        #view-home {
            max-width: 420px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: #171b24;
            border: 1px solid #303746;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .field label {
            font-size: 12px;
            color: #9aa4b8;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > * {
            flex: 1;
        }

        #home-error {
            color: #ff6b6b;
            font-size: 13px;
            min-height: 18px;
        }

        /* Waiting room view */

        #view-waiting {
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        #waiting-code {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 10px;
            background: #171b24;
            border: 1px solid #303746;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        #waiting-hint {
            color: #9aa4b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        #waiting-players {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 25px;
        }

        .waiting-player {
            background: #252b38;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .waiting-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .host-tag {
            margin-left: auto;
            font-size: 11px;
            color: #f9a825;
        }

        #waiting-start-note {
            color: #9aa4b8;
            font-size: 13px;
            margin-top: 10px;
        }

        /* Game view */

        #layout {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        #board {
            width: min(75vw, 800px);
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            background: #eee;
            border: 5px solid #111;
        }

        .cell {
            position: relative;
            background: #f3eedb;
            color: #111;
            border: 1px solid #777;
            display: flex;
            flex-direction: column;
            text-align: center;
            font-size: clamp(7px, 1vw, 12px);
            overflow: hidden;
        }

        .color {
            height: 18%;
            background: #aaa;
        }

        .name {
            font-weight: bold;
            padding: 2px;
        }

        .price {
            font-size: 9px;
        }

        .owner {
            font-size: 8px;
        }

        .tokens {
            position: absolute;
            bottom: 2px;
            left: 2px;
            display: flex;
            gap: 2px;
        }

        .token {
            width: 17px;
            height: 17px;
            border-radius: 50%;
            border: 2px solid white;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
        }

        #center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background: #dcefd8;
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #center h2 {
            font-size: clamp(20px, 4vw, 45px);
            margin: 0;
        }

        #side {
            width: 320px;
        }

        .panel {
            background: #171b24;
            border: 1px solid #303746;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .panel h2 {
            margin-top: 0;
        }

        .player {
            padding: 10px;
            margin-bottom: 7px;
            background: #252b38;
            border-radius: 6px;
        }

        .player.turn {
            outline: 2px solid #62ff8b;
        }

        #dice {
            font-size: 35px;
            margin: 10px 0;
        }

        #log {
            height: 180px;
            overflow-y: auto;
            background: #0b0d12;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
        }

        .logline {
            margin-bottom: 6px;
        }

        @media(max-width: 900px) {
            #layout {
                flex-direction: column;
            }

            #board {
                width: 95vw;
                margin: auto;
            }

            #side {
                width: 95vw;
                margin: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎲 Monopoly</h1>
        <span id="status">Connecting...</span>
        <span id="room-badge" class="hidden"></span>
    </header>

    <!-- Home: host or join -->
    <div id="view-home">
        <div class="card">
            <h2>Host a game</h2>
            <div class="field">
                <label>Your name</label>
                <input id="host-name" placeholder="Your name">
            </div>
            <button id="host-btn" onclick="hostGame()">Host Game</button>
        </div>

        <div class="card">
            <h2>Join a game</h2>
            <div class="field">
                <label>Your name</label>
                <input id="join-name" placeholder="Your name">
            </div>
            <div class="field">
                <label>Room code</label>
                <input id="join-code" placeholder="e.g. ABCD" maxlength="4" style="text-transform: uppercase;">
            </div>
            <button id="join-btn" class="secondary" onclick="joinGame()">Join Game</button>
        </div>

        <div id="home-error"></div>
    </div>

    <!-- Waiting room -->
    <div id="view-waiting" class="hidden">
        <div id="waiting-code"></div>
        <div id="waiting-hint">Share this code with friends so they can join.</div>

        <div id="waiting-players"></div>

        <button id="start-btn" onclick="startGame()">Start Game</button>
        <div id="waiting-start-note"></div>
    </div>

    <!-- Game -->
    <div id="view-game" class="hidden">
        <div id="layout">
            <div id="board"></div>

            <div id="side">
                <div class="panel">
                    <h2>Players</h2>
                    <div id="players"></div>
                </div>

                <div class="panel">
                    <h2>Game</h2>
                    <div id="turn">Waiting...</div>
                    <div id="dice">🎲 🎲</div>
                    <button id="roll" onclick="roll()" disabled>Roll</button>
                    <button id="buy" onclick="buy()" disabled>Buy</button>
                </div>

                <div class="panel">
                    <h2>Log</h2>
                    <div id="log"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOARD = [
            { name: "GO", price: 0, rent: 0 },
            { name: "Mediterranean Avenue", price: 60, rent: 2 },
            { name: "Community Chest", price: 0, rent: 0 },
            { name: "Baltic Avenue", price: 60, rent: 4 },
            { name: "Income Tax", price: 0, rent: 0 },
            { name: "Reading Railroad", price: 200, rent: 25 },
            { name: "Oriental Avenue", price: 100, rent: 6 },
            { name: "Chance", price: 0, rent: 0 },
            { name: "Vermont Avenue", price: 100, rent: 6 },
            { name: "Connecticut Avenue", price: 120, rent: 8 },
            { name: "Jail", price: 0, rent: 0 },
            { name: "St. Charles Place", price: 140, rent: 10 },
            { name: "Electric Company", price: 150, rent: 10 },
            { name: "States Avenue", price: 140, rent: 10 },
            { name: "Virginia Avenue", price: 160, rent: 12 },
            { name: "Pennsylvania Railroad", price: 200, rent: 25 },
            { name: "St. James Place", price: 180, rent: 14 },
            { name: "Community Chest", price: 0, rent: 0 },
            { name: "Tennessee Avenue", price: 180, rent: 14 },
            { name: "New York Avenue", price: 200, rent: 16 },
            { name: "Free Parking", price: 0, rent: 0 },
            { name: "Kentucky Avenue", price: 220, rent: 18 },
            { name: "Chance", price: 0, rent: 0 },
            { name: "Indiana Avenue", price: 220, rent: 18 },
            { name: "Illinois Avenue", price: 240, rent: 20 },
            { name: "B&O Railroad", price: 200, rent: 25 },
            { name: "Atlantic Avenue", price: 260, rent: 22 },
            { name: "Ventnor Avenue", price: 260, rent: 22 },
            { name: "Water Works", price: 150, rent: 10 },
            { name: "Marvin Gardens", price: 280, rent: 24 },
            { name: "Go To Jail", price: 0, rent: 0 },
            { name: "Pacific Avenue", price: 300, rent: 26 },
            { name: "North Carolina Avenue", price: 300, rent: 26 },
            { name: "Community Chest", price: 0, rent: 0 },
            { name: "Pennsylvania Avenue", price: 320, rent: 28 },
            { name: "Short Line", price: 200, rent: 25 },
            { name: "Chance", price: 0, rent: 0 },
            { name: "Park Place", price: 350, rent: 35 },
            { name: "Luxury Tax", price: 0, rent: 0 },
            { name: "Boardwalk", price: 400, rent: 50 }
        ];

        const protocol = location.protocol === "https:" ? "wss://" : "ws://";
        const socket = new WebSocket(protocol + location.host);

        let state = null;
        let myId = null;
        let roomCode = null;

        socket.onopen = () => {
            document.getElementById("status").textContent = "● Connected";
        };

        socket.onclose = () => {
            document.getElementById("status").textContent = "● Disconnected";
        };

        socket.onmessage = event => {
            const data = JSON.parse(event.data);

            if (data.type === "joined") {
                myId = data.id;
                roomCode = data.code;

                document.getElementById("room-badge").textContent = `Room ${roomCode}`;
                document.getElementById("room-badge").classList.remove("hidden");

                clearHomeError();
            }

            if (data.type === "state") {
                state = data;
                render();
            }

            if (data.type === "log") {
                addLog(data.message);
            }

            if (data.type === "dice") {
                document.getElementById("dice").textContent = `🎲 ${data.d1} + 🎲 ${data.d2}`;
            }

            if (data.type === "error") {
                if (state && state.started) {
                    alert(data.message);
                } else {
                    showHomeError(data.message);
                }
            }
        };

        function send(data) {
            socket.send(JSON.stringify(data));
        }

        function showView(name) {
            document.getElementById("view-home").classList.toggle("hidden", name !== "home");
            document.getElementById("view-waiting").classList.toggle("hidden", name !== "waiting");
            document.getElementById("view-game").classList.toggle("hidden", name !== "game");
        }

        function showHomeError(message) {
            document.getElementById("home-error").textContent = message;
        }

        function clearHomeError() {
            document.getElementById("home-error").textContent = "";
        }

        function hostGame() {
            const name = document.getElementById("host-name").value.trim();

            if (!name) {
                showHomeError("Enter your name first.");
                return;
            }

            send({ type: "host", name });
        }

        function joinGame() {
            const name = document.getElementById("join-name").value.trim();
            const code = document.getElementById("join-code").value.trim().toUpperCase();

            if (!name) {
                showHomeError("Enter your name first.");
                return;
            }

            if (code.length !== 4) {
                showHomeError("Enter the 4-letter room code.");
                return;
            }

            send({ type: "join", name, code });
        }

        function startGame() {
            send({ type: "start" });
        }

        function roll() {
            send({ type: "roll" });
        }

        function buy() {
            send({ type: "buy" });
        }

        function addLog(message) {
            const log = document.getElementById("log");
            const div = document.createElement("div");
            div.className = "logline";
            div.textContent = message;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function render() {
            if (state.started) {
                showView("game");
                renderGame();
            } else {
                showView("waiting");
                renderWaiting();
            }
        }

        function renderWaiting() {
            document.getElementById("waiting-code").textContent = state.code;

            const isHost = state.hostId === myId;
            const container = document.getElementById("waiting-players");
            container.innerHTML = "";

            state.players.forEach(player => {
                const div = document.createElement("div");
                div.className = "waiting-player";

                div.innerHTML = `
                    <div class="waiting-dot" style="background: ${player.color}"></div>
                    <span>${escapeHTML(player.name)}</span>
                    ${player.id === state.hostId ? `<span class="host-tag">HOST</span>` : ""}
                `;

                container.appendChild(div);
            });

            const startBtn = document.getElementById("start-btn");
            const note = document.getElementById("waiting-start-note");

            if (isHost) {
                startBtn.classList.remove("hidden");
                startBtn.disabled = state.players.length < 2;
                note.textContent = state.players.length < 2
                    ? "Waiting for at least one more player..."
                    : "";
            } else {
                startBtn.classList.add("hidden");
                note.textContent = "Waiting for the host to start the game...";
            }
        }

        function renderGame() {
            renderPlayers();
            renderBoard();

            const me = state.players.find(p => p.id === myId);
            const current = state.players[state.turn];
            const myTurn = me && current && me.id === current.id;

            document.getElementById("roll").disabled = !myTurn;

            if (me) {
                const tile = BOARD[me.position];
                const property = state.properties[me.position];

                document.getElementById("buy").disabled =
                    !myTurn ||
                    !tile ||
                    tile.price <= 0 ||
                    (property && property.owner !== null);
            }

            document.getElementById("turn").textContent = current
                ? `${current.name}'s turn`
                : "Waiting...";
        }

        function renderPlayers() {
            const container = document.getElementById("players");
            container.innerHTML = "";

            state.players.forEach((player, index) => {
                const div = document.createElement("div");
                div.className = "player";

                if (index === state.turn) {
                    div.classList.add("turn");
                }

                div.innerHTML = `
                    <b>${escapeHTML(player.name)}</b>
                    <br>
                    💰 $${player.money}
                    <br>
                    📍 ${escapeHTML(BOARD[player.position].name)}
                `;

                container.appendChild(div);
            });
        }

        function renderBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            /*
                Convert Monopoly's 40 positions
                into the perimeter of an 11x11 grid.
            */
            const positions = [];

            // Top
            for (let x = 0; x < 11; x++) {
                positions.push(20 + x);
            }

            // Right
            for (let y = 1; y < 10; y++) {
                positions.push(30 + y);
            }

            // Bottom
            for (let x = 10; x >= 0; x--) {
                positions.push(x);
            }

            // Left
            for (let y = 9; y >= 1; y--) {
                positions.push(y * 10);
            }

            const unique = [...new Set(positions)];

            unique.forEach(position => {
                const tile = BOARD[position];
                const cell = document.createElement("div");
                cell.className = "cell";

                const property = state.properties[position];
                const owner = property
                    ? state.players.find(p => p.id === property.owner)
                    : null;

                const playersHere = state.players.filter(p => p.position === position);

                cell.innerHTML = `
                    <div class="color" style="background: ${getColor(position)}"></div>
                    <div class="name">${escapeHTML(tile.name)}</div>
                    ${tile.price ? `<div class="price">$${tile.price}</div>` : ""}
                    ${owner ? `<div class="owner">🏠 ${escapeHTML(owner.name)}</div>` : ""}
                    <div class="tokens">
                        ${playersHere.map(p => `
                            <div class="token" style="background: ${p.color}">
                                ${escapeHTML(p.name[0])}
                            </div>
                        `).join("")}
                    </div>
                `;

                board.appendChild(cell);
            });

            const center = document.createElement("div");
            center.id = "center";
            center.innerHTML = `
                <h2>MONOPOLY</h2>
                <p>${state.players.length} players</p>
            `;

            board.appendChild(center);
        }

        function getColor(position) {
            const colors = {
                1: "#8b5a2b", 3: "#8b5a2b",
                6: "#9ed8e8", 8: "#9ed8e8", 9: "#9ed8e8",
                11: "#c45ccf", 13: "#c45ccf", 14: "#c45ccf",
                16: "#f28b82", 18: "#f28b82", 19: "#f28b82",
                21: "#f5a623", 23: "#f5a623", 24: "#f5a623",
                26: "#e53935", 27: "#e53935", 29: "#e53935",
                31: "#f2d14b", 32: "#f2d14b", 34: "#f2d14b",
                37: "#38a9e0", 39: "#38a9e0"
            };

            return colors[position] || "#aaa";
        }

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
